version: "3.9"

services:
  db:
    image: postgres:16
    container_name: max_ai_bot_db
    environment:
      POSTGRES_DB: max_ai_bot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: max_ai_bot_backend
    depends_on:
      - db
    env_file:
      - .env
    ports:
      - "8000:8000"

volumes:
  postgres_data: